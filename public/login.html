<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mind Map — Login</title>
<link rel="stylesheet" href="/shared.css?v=1">
<style>
  body { display: flex; align-items: center; justify-content: center; height: 100vh; }
  .card {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 32px;
    width: 320px;
  }
  h1 { font-size: 18px; margin: 0 0 20px; }
  .card input { width: 100%; margin-bottom: 12px; }
  .card button { width: 100%; }
  .error { color: var(--danger); font-size: 13px; min-height: 18px; margin-bottom: 8px; }
</style>
</head>
<body>
<script src="/theme.js?v=1"></script>
<button class="theme-toggle" onclick="toggleTheme()">🌓</button>
<div class="card">
  <h1>Mind Map</h1>
  <form id="loginForm">
    <input type="password" id="password" placeholder="Password" autofocus required>
    <div class="error" id="error"></div>
    <button type="submit" class="primary">Unlock</button>
  </form>
</div>
<script src="/login.js?v=1"></script>
</body>
</html>
